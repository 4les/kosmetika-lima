name: Sestavit a nahrát na WEDOS

on:
  push:
    branches: [main]
  workflow_dispatch:   # umožní spustit ručně tlačítkem v záložce Actions

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Stáhnout repozitář
        uses: actions/checkout@v4

      - name: Připravit Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Nainstalovat závislosti
        run: npm ci

      - name: Sestavit web
        run: npm run build

      - name: Nahrát přes FTPS na WEDOS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./dist/
          server-dir: ${{ secrets.FTP_DIR }}
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
